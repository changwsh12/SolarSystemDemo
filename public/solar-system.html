<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>互動式太陽系學習演示</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #app { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; }
    body { background: #0a0a1a; color: #fff; }

    #app { display: flex; flex-direction: column; }

    /* Header */
    .header {
      flex-shrink: 0;
      padding: 12px 24px;
      background: linear-gradient(to right, #0d1b3e, #1a0d3e);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
    .header p { font-size: 0.75rem; color: #9ca3af; margin-top: 2px; }

    /* Main layout */
    .main { display: flex; flex: 1; overflow: hidden; }
    .canvas-wrap { flex: 1; position: relative; min-width: 0; }
    .canvas-wrap canvas { display: block; width: 100%; height: 100%; }

    /* Controls overlay */
    .controls {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
      border-radius: 9999px; padding: 8px 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-play {
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: #fff;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-play:hover { background: rgba(255,255,255,0.2); }
    .btn-play svg { width: 16px; height: 16px; fill: currentColor; }

    .speed-group { display: flex; align-items: center; gap: 8px; }
    .speed-label { font-size: 0.7rem; color: rgba(255,255,255,0.6); }
    .speed-value { font-size: 0.7rem; color: #fff; font-family: monospace; width: 36px; text-align: center; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 120px; height: 6px; background: rgba(255,255,255,0.2);
      border-radius: 3px; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: #60a5fa; border: none;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: #60a5fa; border: none; cursor: pointer;
    }
    .btn-reset {
      font-size: 0.7rem; color: rgba(255,255,255,0.6); padding: 4px 8px;
      border-radius: 4px; background: rgba(255,255,255,0.05); border: none;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-reset:hover { color: #fff; background: rgba(255,255,255,0.1); }

    /* Info panel */
    .panel {
      width: 320px; flex-shrink: 0;
      background: rgba(13,16,37,0.95);
      border-left: 1px solid rgba(255,255,255,0.1);
      overflow-y: auto; padding: 20px;
    }
    .panel h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }
    .panel .desc { font-size: 0.85rem; color: #d1d5db; line-height: 1.6; margin-bottom: 20px; }

    /* Planet header in detail view */
    .planet-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .planet-dot { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
    .planet-header h2 { margin-bottom: 0; font-size: 1.25rem; }
    .planet-header .sub { font-size: 0.7rem; color: #9ca3af; }
    .btn-close {
      margin-left: auto; background: none; border: none; color: rgba(255,255,255,0.4);
      cursor: pointer; padding: 4px; transition: color 0.2s;
    }
    .btn-close:hover { color: #fff; }

    /* Info cards */
    .info-card {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px; border-radius: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 10px;
    }
    .info-card .icon { font-size: 1.1rem; }
    .info-card .label { font-size: 0.7rem; color: #9ca3af; }
    .info-card .value { font-size: 0.85rem; font-weight: 500; margin-top: 2px; }

    /* Planet list */
    .planet-list { display: flex; flex-direction: column; gap: 6px; }
    .planet-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid transparent;
      cursor: pointer; transition: all 0.2s; text-align: left; width: 100%;
      color: #fff; font-family: inherit;
    }
    .planet-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }
    .planet-item .dot { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; }
    .planet-item .info { flex: 1; min-width: 0; }
    .planet-item .name { font-size: 0.85rem; font-weight: 500; }
    .planet-item .en { font-size: 0.7rem; color: #6b7280; }
    .planet-item .dist { font-size: 0.7rem; color: #9ca3af; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    /* Animation */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }

    /* Responsive */
    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .panel { width: 100%; max-height: 45vh; border-left: none; border-top: 1px solid rgba(255,255,255,0.1); }
      .header h1 { font-size: 1.1rem; }
      input[type="range"] { width: 80px; }
    }
  </style>
</head>
<body>
<div id="app">
  <header class="header">
    <h1>🌌 互動式太陽系學習演示</h1>
    <p>點擊行星查看詳細資訊 | 使用控制項調整速度</p>
  </header>
  <div class="main">
    <div class="canvas-wrap">
      <canvas id="solarCanvas"></canvas>
      <div class="controls">
        <button class="btn-play" id="btnPlay" title="播放/暫停">
          <svg id="iconPause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <svg id="iconPlay" viewBox="0 0 24 24" style="display:none"><polygon points="5,3 19,12 5,21"/></svg>
        </button>
        <div class="speed-group">
          <span class="speed-label">速度</span>
          <input type="range" id="speedSlider" min="0.1" max="10" step="0.1" value="1" />
          <span class="speed-value" id="speedValue">1.0x</span>
        </div>
        <button class="btn-reset" id="btnReset">重置</button>
      </div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
// Planet data
const planets = [
  { name:'水星', nameEn:'Mercury', color:'#b5b5b5', radius:4, orbitRadius:60, actualRadius:2439, distanceFromSun:57.9, orbitalPeriod:88, speed:4.15, desc:'太陽系中最小的行星，也是距離太陽最近的行星。表面溫度變化極大，白天可達430°C，夜晚降至-180°C。' },
  { name:'金星', nameEn:'Venus', color:'#e8cda0', radius:7, orbitRadius:95, actualRadius:6052, distanceFromSun:108.2, orbitalPeriod:225, speed:1.62, desc:'太陽系中最熱的行星，擁有濃密的二氧化碳大氣層。大小與地球相近，被稱為地球的「姊妹星」。' },
  { name:'地球', nameEn:'Earth', color:'#4da6ff', radius:7, orbitRadius:130, actualRadius:6371, distanceFromSun:149.6, orbitalPeriod:365, speed:1.0, desc:'我們的家園，太陽系中唯一已知存在生命的行星。擁有液態水和適宜的大氣層，表面71%被水覆蓋。' },
  { name:'火星', nameEn:'Mars', color:'#e04040', radius:5, orbitRadius:170, actualRadius:3390, distanceFromSun:227.9, orbitalPeriod:687, speed:0.53, desc:'被稱為「紅色星球」，表面富含氧化鐵。擁有太陽系最高的山峰——奧林帕斯山，高達21.9公里。' },
  { name:'木星', nameEn:'Jupiter', color:'#c88b3a', radius:16, orbitRadius:230, actualRadius:69911, distanceFromSun:778.5, orbitalPeriod:4333, speed:0.084, desc:'太陽系中最大的行星，是一顆氣態巨行星。著名的大紅斑是一個持續數百年的巨大風暴系統。' },
  { name:'土星', nameEn:'Saturn', color:'#e8d082', radius:14, orbitRadius:290, actualRadius:58232, distanceFromSun:1434, orbitalPeriod:10759, speed:0.034, desc:'以壯觀的環系統聞名，主要由冰和岩石碎片組成。密度低於水，是太陽系密度最低的行星。', ringColor:'#d4b86a' },
  { name:'天王星', nameEn:'Uranus', color:'#7de8e8', radius:10, orbitRadius:345, actualRadius:25362, distanceFromSun:2871, orbitalPeriod:30687, speed:0.012, desc:'一顆冰巨行星，自轉軸幾乎平躺在軌道面上，像是「躺著」公轉。擁有淡藍色的外觀。' },
  { name:'海王星', nameEn:'Neptune', color:'#4466ff', radius:10, orbitRadius:395, actualRadius:24622, distanceFromSun:4495, orbitalPeriod:60190, speed:0.006, desc:'太陽系中距離太陽最遠的行星。擁有太陽系中最強的風，風速可達每小時2,100公里。' }
];

// State
let isPlaying = true;
let speed = 1;
let time = 0;
let lastTimestamp = 0;
let selectedPlanet = null;
let hoveredPlanet = null;
let planetPositions = [];

// Canvas setup
const canvas = document.getElementById('solarCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Stars (pre-generated for consistency)
const stars = [];
for (let i = 0; i < 200; i++) {
  const seed = i * 9301 + 49297;
  stars.push({
    x: (seed % 233280) / 233280,
    y: ((seed * 7) % 233280) / 233280,
    size: ((seed * 13) % 100) / 100 * 1.5 + 0.3,
    alpha: ((seed * 17) % 100) / 100 * 0.5 + 0.3
  });
}

// Color helpers
function lightenColor(hex, amount) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, (num >> 16) + amount);
  const g = Math.min(255, ((num >> 8) & 0xff) + amount);
  const b = Math.min(255, (num & 0xff) + amount);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function darkenColor(hex, amount) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.max(0, (num >> 16) - amount);
  const g = Math.max(0, ((num >> 8) & 0xff) - amount);
  const b = Math.max(0, (num & 0xff) - amount);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}

function formatPeriod(days) {
  if (days < 365) return days + ' 地球日';
  const years = days / 365.25;
  if (years < 2) return days.toLocaleString() + ' 地球日 (' + years.toFixed(2) + ' 年)';
  return years.toFixed(1) + ' 地球年 (' + days.toLocaleString() + ' 日)';
}

// Draw
function draw() {
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;

  // Background
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, w, h);

  // Stars
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x * w, s.y * h, s.size, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,' + s.alpha + ')';
    ctx.fill();
  });

  // Orbits
  planets.forEach(p => {
    ctx.beginPath();
    ctx.arc(cx, cy, p.orbitRadius, 0, Math.PI * 2);
    ctx.strokeStyle = hoveredPlanet === p.name ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.08)';
    ctx.lineWidth = hoveredPlanet === p.name ? 1.5 : 0.5;
    ctx.stroke();
  });

  // Sun
  const sunGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
  sunGrad.addColorStop(0, '#fff7a0');
  sunGrad.addColorStop(0.3, '#ffdd44');
  sunGrad.addColorStop(0.7, '#ff9900');
  sunGrad.addColorStop(1, 'rgba(255,102,0,0.27)');
  ctx.beginPath();
  ctx.arc(cx, cy, 30, 0, Math.PI * 2);
  ctx.fillStyle = sunGrad;
  ctx.fill();

  // Sun glow
  const glowGrad = ctx.createRadialGradient(cx, cy, 25, cx, cy, 55);
  glowGrad.addColorStop(0, 'rgba(255,200,50,0.3)');
  glowGrad.addColorStop(1, 'rgba(255,200,50,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, 55, 0, Math.PI * 2);
  ctx.fillStyle = glowGrad;
  ctx.fill();

  // Planets
  planetPositions = [];
  planets.forEach(p => {
    const angle = time * p.speed * 0.01;
    const x = cx + Math.cos(angle) * p.orbitRadius;
    const y = cy + Math.sin(angle) * p.orbitRadius;
    planetPositions.push({ name: p.name, x, y, radius: p.radius });

    // Glow
    const pg = ctx.createRadialGradient(x, y, p.radius * 0.5, x, y, p.radius * 2);
    pg.addColorStop(0, p.color + '44');
    pg.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(x, y, p.radius * 2, 0, Math.PI * 2);
    ctx.fillStyle = pg;
    ctx.fill();

    // Body
    const bg = ctx.createRadialGradient(x - p.radius * 0.3, y - p.radius * 0.3, 0, x, y, p.radius);
    bg.addColorStop(0, lightenColor(p.color, 40));
    bg.addColorStop(0.7, p.color);
    bg.addColorStop(1, darkenColor(p.color, 40));
    ctx.beginPath();
    ctx.arc(x, y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = bg;
    ctx.fill();

    // Saturn ring
    if (p.ringColor) {
      ctx.beginPath();
      ctx.ellipse(x, y, p.radius * 2, p.radius * 0.5, 0.3, 0, Math.PI * 2);
      ctx.strokeStyle = p.ringColor + 'aa';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // Label
    if (hoveredPlanet === p.name || p.radius >= 10) {
      ctx.font = '11px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, x, y - p.radius - 8);
    }
  });
}

// Animation loop
function animate(timestamp) {
  if (lastTimestamp === 0) lastTimestamp = timestamp;
  if (isPlaying) {
    const delta = (timestamp - lastTimestamp) * speed;
    time += delta * 0.06;
  }
  lastTimestamp = timestamp;
  draw();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// Click handling
canvas.addEventListener('click', function(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let found = null;
  for (const pos of planetPositions) {
    const dist = Math.sqrt((mx - pos.x) ** 2 + (my - pos.y) ** 2);
    if (dist <= pos.radius + 8) {
      found = planets.find(p => p.name === pos.name);
      break;
    }
  }
  selectedPlanet = found;
  renderPanel();
});

canvas.addEventListener('mousemove', function(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let found = null;
  for (const pos of planetPositions) {
    const dist = Math.sqrt((mx - pos.x) ** 2 + (my - pos.y) ** 2);
    if (dist <= pos.radius + 8) {
      found = pos.name;
      canvas.style.cursor = 'pointer';
      break;
    }
  }
  if (!found) canvas.style.cursor = 'default';
  hoveredPlanet = found;
});

// Controls
document.getElementById('btnPlay').addEventListener('click', function() {
  isPlaying = !isPlaying;
  document.getElementById('iconPause').style.display = isPlaying ? 'block' : 'none';
  document.getElementById('iconPlay').style.display = isPlaying ? 'none' : 'block';
});

document.getElementById('speedSlider').addEventListener('input', function() {
  speed = parseFloat(this.value);
  document.getElementById('speedValue').textContent = speed.toFixed(1) + 'x';
});

document.getElementById('btnReset').addEventListener('click', function() {
  speed = 1;
  document.getElementById('speedSlider').value = 1;
  document.getElementById('speedValue').textContent = '1.0x';
});

// Panel rendering
function renderPanel() {
  const panel = document.getElementById('panel');
  if (selectedPlanet) {
    const p = selectedPlanet;
    const distStr = p.distanceFromSun < 1000
      ? p.distanceFromSun + ' 百萬公里'
      : (p.distanceFromSun / 1000).toFixed(1) + ' 十億公里';
    panel.innerHTML = '<div class="fade-in">' +
      '<div class="planet-header">' +
        '<div class="planet-dot" style="background:radial-gradient(circle at 35% 35%,' + lightenColor(p.color,40) + ',' + p.color + ',' + darkenColor(p.color,40) + ')"></div>' +
        '<div><h2>' + p.name + '</h2><div class="sub">' + p.nameEn + '</div></div>' +
        '<button class="btn-close" id="btnClosePanel"><svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>' +
      '</div>' +
      '<p class="desc">' + p.desc + '</p>' +
      '<div class="info-card"><span class="icon">📏</span><div><div class="label">半徑</div><div class="value">' + p.actualRadius.toLocaleString() + ' 公里</div></div></div>' +
      '<div class="info-card"><span class="icon">☀️</span><div><div class="label">與太陽的距離</div><div class="value">' + distStr + '</div></div></div>' +
      '<div class="info-card"><span class="icon">🔄</span><div><div class="label">公轉週期</div><div class="value">' + formatPeriod(p.orbitalPeriod) + '</div></div></div>' +
      '<div class="info-card"><span class="icon">⚡</span><div><div class="label">相對速度</div><div class="value">' + p.speed.toFixed(3) + 'x (地球 = 1x)</div></div></div>' +
    '</div>';
    document.getElementById('btnClosePanel').addEventListener('click', function() {
      selectedPlanet = null;
      renderPanel();
    });
  } else {
    let html = '<h2>🪐 太陽系行星</h2><p style="font-size:0.8rem;color:#9ca3af;margin-bottom:16px;">點擊畫布上的行星查看詳細資訊</p><div class="planet-list">';
    planets.forEach(p => {
      const distStr = p.distanceFromSun < 1000
        ? p.distanceFromSun + ' 百萬km'
        : (p.distanceFromSun / 1000).toFixed(1) + ' 十億km';
      html += '<button class="planet-item" data-name="' + p.name + '">' +
        '<div class="dot" style="background:radial-gradient(circle at 35% 35%,' + lightenColor(p.color,30) + ',' + p.color + ')"></div>' +
        '<div class="info"><div class="name">' + p.name + '</div><div class="en">' + p.nameEn + '</div></div>' +
        '<div class="dist">' + distStr + '</div>' +
      '</button>';
    });
    html += '</div>';
    panel.innerHTML = html;
    panel.querySelectorAll('.planet-item').forEach(btn => {
      btn.addEventListener('click', function() {
        selectedPlanet = planets.find(p => p.name === this.dataset.name);
        renderPanel();
      });
      btn.addEventListener('mouseenter', function() {
        hoveredPlanet = this.dataset.name;
      });
      btn.addEventListener('mouseleave', function() {
        hoveredPlanet = null;
      });
    });
  }
}
renderPanel();
</script>
</body>
</html>
